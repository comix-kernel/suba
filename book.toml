[book]
authors = ["Suba"]
language = "zh-CN"
src = "document"
title = "Suba 内核文档"
description = "Suba 是一个可以在 QEMU 中运行的双核 RV64 教学内核"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/comix-kernel/suba"
edit-url-template = "https://github.com/comix-kernel/suba/edit/main/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1
